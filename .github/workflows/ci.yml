name: Compiler and examples

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
      - 'llms.txt'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
      - 'llms.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run compiler and package tests
        run: go test ./...

      - name: Smoke test every example in a fresh project
        run: ./scripts/smoke-examples.sh

      - name: Check Go interoperability without Java
        run: ./scripts/check-go-interop.sh

  java-analysis:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '27']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up reference JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Check typed Java migration analysis
        env:
          GPP_TEST_JAVA: java
          GPP_TEST_JAVA_RELEASE: ${{ matrix.java }}
        run: go test ./internal/javaport

      - name: Check the JVM extension callback prototype
        run: ./scripts/check-jvm-interop.sh
